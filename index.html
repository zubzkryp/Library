<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Library</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="header">   
                <div class="title">My Library</div>
                <button class="add-button" command="show-modal" commandfor="my-dialog">+Add Book</button>
            </div>
            <dialog id="my-dialog">
                <form class="form_class" action="#" method="post">
                    <div class="information">
                        <div class="TITLE">
                            <label for="title">Title</label>
                            <input type="text" name="bookTitle" id="title" placeholder="Harry Potter"/>
                        </div>
                        <div class="AUTHOR">
                            <label for="author">Author</label>
                            <input type="text" name="bookAuthor" id="author" placeholder="J.K Rowling"/>
                        </div>
                        <div class="PAGES">
                            <label for="pages">How many pages have you read?</label>
                            <input type="text" name="bookPages" id="pages" placeholder="200"/>
                        </div>
                        <div class="READ">
                            <label for="read">Have you finished it?</label>
                            <input type="text" name="bookRead" id="read" placeholder="Yes/No"/>
                        </div>
                    </div>
                    <button class="submitButton" type="submit">Submit</button>
                </form>
            </dialog>
            <div class="new-books">
                
            </div>
            
        </div>
    </body>

</html>
